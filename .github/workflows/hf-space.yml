name: hf-space
# Mirrors the app to a Hugging Face Space (free CPU, public HTTPS URL) while AWS is not available.
# One-time setup: repo secret HF_TOKEN (write token) + repo variable HF_SPACE (e.g. SimonB51/meter-reader).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "models/**", "samples/**", "Dockerfile", "requirements.txt"]

jobs:
  sync:
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Space folder
        run: |
          mkdir space && cp -r Dockerfile requirements.txt models src samples space/
          {
            echo "---"
            echo "title: Meter Reader"
            echo "emoji: 💧"
            echo "colorFrom: green"
            echo "colorTo: gray"
            echo "sdk: docker"
            echo "app_port: 8080"
            echo "pinned: false"
            echo "---"
            echo
            echo "AI water-meter reading. Source and documentation: https://github.com/${{ github.repository }}"
          } > space/README.md
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ.get("SPACE") or "${{ vars.HF_SPACE }}"
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(folder_path="space", repo_id=space, repo_type="space",
                            commit_message="sync from GitHub ${{ github.sha }}", delete_patterns=["*"])
          print("https://huggingface.co/spaces/" + space)
          PY
