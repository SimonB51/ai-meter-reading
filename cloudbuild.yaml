# Google Cloud Build config used by: gcloud builds submit --config cloudbuild.yaml
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--build-arg", "BASE_IMAGE=mirror.gcr.io/library/python:3.12-slim",
           "-t", "europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/meter-reader", "."]
images: ["europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/meter-reader"]
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
